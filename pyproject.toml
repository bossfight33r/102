[project]
name = "outlier-radar"
version = "0.1.0"
description = "Мониторинг ниш YouTube, поиск роликов-аутлайеров и утренний дайджест идей в Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "aiogram>=3.10",
    "pyyaml>=6.0",
    "tzdata>=2026.5",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
